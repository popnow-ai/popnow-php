name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor matches the require in composer.json. Testing only the newest release would
        # leave problems for users on 8.1 to discover themselves.
        php-version: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, hash, curl
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Syntax
        run: find src tests examples scripts autoload.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php
      - name: Contract drift
        # Compares the pinned contracts/openapi.yaml and the hard-coded enums with the published
        # contract. Needs no credentials.
        run: php scripts/check_contract.php
